# Change these first
owner: developer-gui # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: Company Profile
    url: https://gui-group.co.id/
    retries: 2 # Replicate Uptime Kuma retry threshold: retry 2 times before recording DOWN / alerting
    retryDelay: 5000 # Wait 5000ms between attempts
    maxResponseTime: 30000 # Alert if response exceeds 30s
    expectedStatusCodes:
      - 200
      - 301
      - 302
  - name: E Website
    url: $SECRET_SITE_1
    retries: 2
    retryDelay: 5000
    maxResponseTime: 30000 # Alert if response exceeds 30s
    expectedStatusCodes:
      - 200
      - 301
      - 302
  - name: C Website
    url: $SECRET_SITE_2
    retries: 5
    retryDelay: 5000
    maxResponseTime: 30000 # Alert if response exceeds 30s
    expectedStatusCodes:
      - 200
      - 301
      - 302
  - name: Rp Website
    url: $SECRET_SITE_3
    retries: 5
    retryDelay: 5000
    maxResponseTime: 30000 # Alert if response exceeds 30s
    expectedStatusCodes:
      - 200
      - 301
      - 302
  - name: Google
    url: https://www.google.com
    # No retries configured: fails immediately on first attempt (per-site strict threshold)
    expectedStatusCodes:
      - 200
      - 301
      - 302

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  cname: uptime.gui-group.co.id
  # baseUrl: /
  logoUrl: https://raw.githubusercontent.com/developer-gui/upptime/refs/heads/master/logo.webp
  name: Uptime Checker
  introTitle: "Status Website Checker"
  introMessage: This is uptime website checker
  
  navbar:
    - title: Status
      href: /

  scripts:
    - src: /assets/detail-ranges.js
      async: true
  links:
    - rel: stylesheet
      href: /assets/detail-ranges.css

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
i18n:
  footer: Powered by [Upptime](https://upptime.js.org)
